<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>People Space — Born From a Burst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Italiana&family=Tenor+Sans&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #000000;
    --bg-deep-2: #050309;
    --violet: #4a1f9c;
    --violet-bright: #7b2ff7;
    --magenta: #d946ef;
    --pink: #f472b6;
    --gold: #fbbf24;
    --orange: #fb923c;
    --amber: #d4a266;
    --warm-dust: #8b6f4e;
    --blue-deep: #1e3a8a;
    --cyan: #67e8f9;
    --text: #f5f3ff;
    --muted: rgba(245,243,255,.7);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg-deep);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  html{scroll-behavior:smooth}

  /* === Scroll-driven container === */
  #scroller{
    height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  #scroller::-webkit-scrollbar{display:none}

  /* shared cosmic background — fixed behind scrolling sections */
  .bg-fixed{
    position:fixed;inset:0;z-index:0;pointer-events:none;
  }
  /* === Milky Way background === */
  .deep-space{
    position:absolute;inset:0;
    background:#000000;
  }
  /* The galactic band — diagonal warm Milky Way core */
  .nebula{position:absolute;inset:0;overflow:hidden}
  .milky-band{
    position:absolute;left:-15%;right:-15%;top:30%;height:55%;
    transform:rotate(-22deg);transform-origin:center center;
    background:
      /* dark dust lane within the band */
      radial-gradient(ellipse 55% 8% at 60% 50%, rgba(0,0,0,.85) 0%, transparent 60%),
      /* core bright glow */
      radial-gradient(ellipse 30% 60% at 60% 50%, rgba(255,210,140,.55) 0%, rgba(212,162,102,.35) 30%, transparent 65%),
      /* outer warm haze */
      radial-gradient(ellipse 80% 45% at 60% 50%, rgba(170,120,80,.30) 0%, rgba(110,80,60,.15) 50%, transparent 80%),
      /* faint cool purple edge */
      radial-gradient(ellipse 90% 40% at 30% 50%, rgba(80,60,120,.18) 0%, transparent 70%);
    filter:blur(2px);
    opacity:.95;
    animation:bandDrift 60s ease-in-out infinite alternate;
  }
  @keyframes bandDrift{
    0%  {transform:rotate(-22deg) translate(0,0) scale(1.0)}
    100%{transform:rotate(-21deg) translate(-1%,0) scale(1.04)}
  }
  /* dust clouds along the band */
  .dust-cloud{
    position:absolute;border-radius:50%;filter:blur(60px);mix-blend-mode:screen;
    pointer-events:none;
  }
  .dust-cloud.c1{
    width:60%;height:30%;top:38%;left:35%;
    background:radial-gradient(circle, rgba(212,162,102,.45), transparent 60%);
    transform:rotate(-22deg);
    animation:cloudA 50s ease-in-out infinite alternate;
  }
  .dust-cloud.c2{
    width:40%;height:22%;top:46%;left:55%;
    background:radial-gradient(circle, rgba(255,200,140,.35), transparent 60%);
    transform:rotate(-22deg);
    animation:cloudB 60s ease-in-out infinite alternate;
  }
  .dust-cloud.c3{
    width:50%;height:28%;top:30%;left:15%;
    background:radial-gradient(circle, rgba(120,90,140,.22), transparent 60%);
    transform:rotate(-22deg);
    animation:cloudA 70s ease-in-out infinite alternate-reverse;
  }
  /* dark dust streaks within the band */
  .dust-streak{
    position:absolute;top:48%;left:25%;width:55%;height:3%;
    background:linear-gradient(90deg, transparent, rgba(0,0,0,.85), transparent);
    transform:rotate(-22deg);filter:blur(8px);
  }
  .dust-streak.s2{top:55%;left:30%;width:45%;height:2.5%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.7),transparent)}
  @keyframes cloudA{from{transform:rotate(-22deg) translate(-1%,-1%) scale(1)}to{transform:rotate(-22deg) translate(1%,1%) scale(1.1)}}
  @keyframes cloudB{from{transform:rotate(-22deg) translate(1%,1%) scale(1.05)}to{transform:rotate(-22deg) translate(-1%,-1%) scale(1)}}

  .stars-canvas{position:absolute;inset:0}

  /* cinematic vignette + letterbox feel */
  .vignette{
    position:fixed;inset:0;z-index:90;pointer-events:none;
    background:
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 14%, transparent 86%, rgba(0,0,0,.35) 100%);
  }
  .grain{
    position:fixed;inset:0;z-index:91;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='3'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.7'/></svg>");
  }

  /* dust particles */
  .dust{position:absolute;inset:0;pointer-events:none}
  .dust span{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#fff;opacity:.6;
    box-shadow:0 0 6px rgba(255,255,255,.6);
    animation:floatDust 18s linear infinite;
  }
  @keyframes floatDust{
    0%{transform:translate3d(0,0,0);opacity:0}
    10%{opacity:.7}
    100%{transform:translate3d(40px,-60px,0);opacity:0}
  }

  /* === Scenes === */
  .scene{
    position:relative;width:100%;height:100vh;
    scroll-snap-align:start;scroll-snap-stop:always;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;z-index:5;
  }
  .scene-inner{position:absolute;inset:0;z-index:3}

  /* === Per-section unique aura — layered on top of shared Milky Way === */
  .scene::before{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    opacity:0;transition:opacity 1.4s ease;
    mix-blend-mode:screen;
  }
  .scene.active::before{opacity:1}

  /* I — VAST: deep cosmic distance, cool blue-purple with distant warm core */
  #s1::before{
    background:
      radial-gradient(ellipse 70% 55% at 50% 50%, rgba(255,210,150,.28) 0%, rgba(180,120,80,.18) 25%, transparent 60%),
      radial-gradient(ellipse 100% 80% at 50% 50%, rgba(60,80,160,.25) 0%, transparent 70%);
    animation:pulseS1 9s ease-in-out infinite alternate;
  }
  @keyframes pulseS1{from{transform:scale(1)}to{transform:scale(1.1)}}

  /* II — CHAOS: red-orange turbulent zone */
  #s2::before{
    background:
      radial-gradient(ellipse 60% 45% at 35% 45%, rgba(220,90,60,.30) 0%, transparent 65%),
      radial-gradient(ellipse 55% 40% at 70% 60%, rgba(255,140,60,.28) 0%, transparent 65%),
      radial-gradient(ellipse 90% 70% at 50% 50%, rgba(80,30,60,.25) 0%, transparent 75%);
    animation:driftS2 14s ease-in-out infinite alternate;
  }
  @keyframes driftS2{from{transform:translate(-1%,-1%)}to{transform:translate(1%,1%)}}

  /* III — ORBIT: cooler ordered blues and teals */
  #s3::before{
    background:
      radial-gradient(circle at 50% 50%, rgba(80,160,200,.28) 0%, rgba(40,80,140,.18) 35%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(120,200,220,.10) 0%, transparent 60%);
  }

  /* IV — ECOSYSTEM: warm rose-pink network glow */
  #s4::before{
    background:
      radial-gradient(ellipse 75% 55% at 50% 50%, rgba(220,90,160,.32) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 30% 35%, rgba(255,180,100,.18) 0%, transparent 65%),
      radial-gradient(ellipse 60% 50% at 70% 65%, rgba(140,60,180,.22) 0%, transparent 65%);
    animation:driftS2 18s ease-in-out infinite alternate-reverse;
  }

  /* V — BURST: bright supernova white-yellow-orange explosion */
  #s5::before{
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.55) 0%, rgba(255,210,140,.45) 12%, rgba(255,140,60,.35) 30%, rgba(180,40,80,.20) 55%, transparent 80%);
    animation:pulseS5 6s ease-in-out infinite alternate;
  }
  @keyframes pulseS5{from{transform:scale(1);opacity:.85}to{transform:scale(1.15);opacity:1}}

  /* VI — PEOPLE SPACE: warm amber/gold birth zone */
  #s6::before{
    background:
      radial-gradient(circle at 50% 50%, rgba(255,200,120,.40) 0%, rgba(255,150,80,.25) 30%, rgba(120,60,80,.18) 60%, transparent 80%);
    animation:pulseS1 10s ease-in-out infinite alternate;
  }

  /* VII — POSSIBILITIES: 4 cluster colors radiating from center */
  #s7::before{
    background:
      radial-gradient(circle at 18% 22%, rgba(255,180,100,.28) 0%, transparent 28%),
      radial-gradient(circle at 82% 22%, rgba(220,90,160,.28) 0%, transparent 28%),
      radial-gradient(circle at 18% 78%, rgba(120,180,255,.25) 0%, transparent 28%),
      radial-gradient(circle at 82% 78%, rgba(180,120,255,.28) 0%, transparent 28%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.10) 0%, transparent 35%);
    animation:driftS2 20s ease-in-out infinite alternate;
  }

  /* VIII — LET'S BEGIN: calm panoramic finale, slight warm glow at center */
  #s8::before{
    background:
      radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,200,140,.25) 0%, rgba(180,120,80,.15) 30%, transparent 70%),
      radial-gradient(ellipse 100% 80% at 50% 50%, rgba(50,30,80,.20) 0%, transparent 75%);
  }

  /* Section-specific accents (additional after-element) */
  .scene::after{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    opacity:0;transition:opacity 1.4s ease;
  }
  .scene.active::after{opacity:1}
  /* III — radial guide rings as a subtle decoration */
  #s3::after{
    background:
      repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 110px, rgba(120,200,220,.04) 110px, rgba(120,200,220,.04) 112px);
  }
  /* V — radial burst rays */
  #s5::after{
    background:
      conic-gradient(from 0deg at 50% 50%,
        rgba(255,210,140,.10) 0deg, transparent 8deg, transparent 22deg,
        rgba(255,210,140,.08) 30deg, transparent 38deg, transparent 52deg,
        rgba(255,210,140,.10) 60deg, transparent 68deg, transparent 82deg,
        rgba(255,210,140,.08) 90deg, transparent 98deg, transparent 112deg,
        rgba(255,210,140,.10) 120deg, transparent 128deg, transparent 142deg,
        rgba(255,210,140,.08) 150deg, transparent 158deg, transparent 172deg,
        rgba(255,210,140,.10) 180deg, transparent 188deg, transparent 202deg,
        rgba(255,210,140,.08) 210deg, transparent 218deg, transparent 232deg,
        rgba(255,210,140,.10) 240deg, transparent 248deg, transparent 262deg,
        rgba(255,210,140,.08) 270deg, transparent 278deg, transparent 292deg,
        rgba(255,210,140,.10) 300deg, transparent 308deg, transparent 322deg,
        rgba(255,210,140,.08) 330deg, transparent 338deg, transparent 360deg);
    mix-blend-mode:screen;
    animation:rotateRays 60s linear infinite;
  }
  @keyframes rotateRays{to{transform:rotate(360deg)}}
  /* VIII — gentle vignette for the finale */
  #s8::after{
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.45) 80%);
  }

  /* Reveal animation runs when section becomes active */
  .reveal{opacity:0;transform:translateY(20px) scale(.97);transition:opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1)}
  .scene.active .reveal{opacity:1;transform:translateY(0) scale(1)}
  .delay-1{transition-delay:.1s}
  .delay-2{transition-delay:.4s}
  .delay-3{transition-delay:.7s}
  .delay-4{transition-delay:1.1s}
  /* Big keywords skip the parent-level reveal entirely — letters animate themselves */
  .keyword.reveal{opacity:1;transform:none;transition:none}

  /* === Display typography for keywords — same size & style on every page === */
  .keyword{
    position:absolute;
    font-family:'Cormorant Garamond', 'Italiana', serif;
    font-weight:500;font-style:italic;letter-spacing:.02em;
    font-size:clamp(40px, 7.5vw, 170px);   /* conservative base — JS may downscale further */
    line-height:.95;
    color:#ffffff;text-transform:uppercase;
    z-index:20;text-align:center;
    max-width:80vw;
    white-space:normal;            /* allow wrap for very long words on narrow screens */
    overflow-wrap:break-word;
    text-shadow:
      0 0 14px rgba(255,255,255,.95),
      0 0 32px rgba(255,240,210,.7),
      0 0 70px rgba(255,200,120,.6),
      0 0 130px rgba(212,162,102,.5);
  }
  .ksplit-wrap{display:inline-block}
  /* keep colour & shadows on the inner letter spans so the per-letter wrapping doesn't kill them */
  .keyword .ksplit > span{
    color:#ffffff;
    text-shadow:inherit;
  }
  /* dark glow halo behind big keywords for guaranteed legibility */
  .scene .kw-halo{
    position:absolute;z-index:18;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.65) 0%, rgba(0,0,0,.35) 35%, transparent 70%);
    filter:blur(28px);opacity:0;transition:opacity 1s ease .2s;
  }
  .scene .kw-halo.center,
  .scene .kw-halo.bottom{left:50%;top:50%;width:96%;height:60%;transform:translate(-50%,-50%)}
  .scene.active .kw-halo{opacity:1}
  .keyword.center,
  .keyword.bottom{top:50%;left:50%;transform:translate(-50%,-50%)}
  /* per-letter wrapper for animated reveal */
  .ksplit{display:inline-block;white-space:nowrap}
  .ksplit > span{
    display:inline-block;opacity:0;transform:translateY(20px) scale(.98);
    filter:blur(10px);
    transition:opacity .7s ease, transform .9s cubic-bezier(.2,.85,.2,1), filter .7s ease;
  }
  .scene.active .ksplit > span{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  /* underline flourish under center keywords */
  .ksplit-wrap{position:relative;display:inline-block}
  .ksplit-wrap::after{
    content:"";position:absolute;left:50%;bottom:-.2em;width:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),var(--magenta),transparent);
    transform:translateX(-50%);transition:width 1.6s ease 1.2s;
  }
  .scene.active .ksplit-wrap::after{width:60%}

  /* === Section 1: VAST cinematic zoom === */
  #s1 .vast-core{
    position:absolute;width:60%;aspect-ratio:1;border-radius:50%;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.4);
    background:radial-gradient(circle, rgba(255,235,200,.65) 0%, rgba(212,162,102,.4) 25%, rgba(110,80,60,.25) 55%, transparent 80%);
    filter:blur(28px);opacity:.4;mix-blend-mode:screen;
  }
  .scene.active#s1 .vast-core{animation:zoomNebula 11s ease-out forwards}
  @keyframes zoomNebula{
    0%{transform:translate(-50%,-50%) scale(.4);opacity:.4}
    100%{transform:translate(-50%,-50%) scale(2.2);opacity:.85}
  }

  /* === Section 2: CHAOS === */
  #s2 .chaos{position:absolute;inset:0}
  #s2 .body{
    position:absolute;width:8px;height:8px;border-radius:50%;
    background:#fff;box-shadow:0 0 12px #fff,0 0 30px var(--magenta);
    transition:left .8s ease, top .8s ease;
  }

  /* === Section 3: ORBIT === */
  #s3 .orbit-system{position:absolute;width:min(80vh,80vw);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%)}
  #s3 .orbit-ring{
    position:absolute;border-radius:50%;border:1px solid rgba(244,114,182,.35);
    left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
    box-shadow:0 0 30px rgba(217,70,239,.15) inset;opacity:0;
  }
  .scene.active#s3 .orbit-ring{animation:orbitFade 1.6s cubic-bezier(.2,.8,.2,1) forwards}
  #s3 .orbit-ring.r1{width:30%;aspect-ratio:1;animation-delay:.1s;border-color:rgba(251,146,60,.55)}
  #s3 .orbit-ring.r2{width:55%;aspect-ratio:1;animation-delay:.4s;border-color:rgba(244,114,182,.45)}
  #s3 .orbit-ring.r3{width:80%;aspect-ratio:1;animation-delay:.8s;border-color:rgba(123,47,247,.45)}
  #s3 .orbit-ring.r4{width:105%;aspect-ratio:1;animation-delay:1.2s;border-color:rgba(103,232,249,.3)}
  @keyframes orbitFade{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  #s3 .orbit-body{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0}
  #s3 .orbit-body .planet{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%)}
  #s3 .orbit-body.b1{animation:spin 6s linear infinite}
  #s3 .orbit-body.b2{animation:spin 11s linear infinite reverse}
  #s3 .orbit-body.b3{animation:spin 16s linear infinite}
  #s3 .orbit-body.b4{animation:spin 22s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  #s3 .core-star{
    position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, #fff, var(--gold) 40%, transparent 70%);
    box-shadow:0 0 50px var(--gold), 0 0 120px var(--magenta);
  }

  /* === Section 4: ECOSYSTEM === */
  #s4 svg{position:absolute;inset:0;width:100%;height:100%}
  #s4 .node{
    position:absolute;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle,#fff,var(--pink) 50%, transparent 80%);
    box-shadow:0 0 18px var(--magenta);
    transform:translate(-50%,-50%);
    animation:pulseNode 2.6s ease-in-out infinite;
  }
  @keyframes pulseNode{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.4)}}
  .net-line{stroke:url(#netGrad);stroke-width:1;fill:none;opacity:.55}

  /* === Section 5: BURST + lingering remnant for continuity === */
  #s5 .burst-core{
    position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle,#fff 0%, var(--gold) 30%, var(--magenta) 60%, transparent 80%);
    box-shadow:0 0 80px var(--gold);opacity:0;
  }
  .scene.active#s5 .burst-core{animation:supernova 5s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes supernova{
    0%{transform:translate(-50%,-50%) scale(0);opacity:1}
    18%{transform:translate(-50%,-50%) scale(1);opacity:1}
    35%{transform:translate(-50%,-50%) scale(8);opacity:.9;filter:brightness(1.4)}
    60%{transform:translate(-50%,-50%) scale(30);opacity:.55}
    100%{transform:translate(-50%,-50%) scale(50);opacity:0}
  }
  /* lingering remnant — stays as the seed for Section 6's central sphere */
  #s5 .burst-remnant{
    position:absolute;left:50%;top:50%;width:140px;height:140px;border-radius:50%;
    transform:translate(-50%,-50%) scale(0);opacity:0;
    background:radial-gradient(circle at 35% 35%, #fff 0%, #fde68a 30%, var(--magenta) 65%, var(--violet-bright) 100%);
    box-shadow:0 0 80px var(--magenta), 0 0 200px var(--gold);
  }
  .scene.active#s5 .burst-remnant{animation:remnantSettle 4s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:2s}
  @keyframes remnantSettle{
    0%  {transform:translate(-50%,-50%) scale(0);opacity:0}
    40% {transform:translate(-50%,-50%) scale(1.3);opacity:.95}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}
  }
  #s5 .shockwave{
    position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;
    transform:translate(-50%,-50%);
    border:2px solid rgba(244,114,182,.7);opacity:0;
  }
  .scene.active#s5 .shockwave{animation:shock 3.4s ease-out forwards}
  .scene.active#s5 .shockwave.s1{animation-delay:.9s}
  .scene.active#s5 .shockwave.s2{animation-delay:1.6s}
  .scene.active#s5 .shockwave.s3{animation-delay:2.4s}
  @keyframes shock{
    0%{transform:translate(-50%,-50%) scale(.5);opacity:.9}
    100%{transform:translate(-50%,-50%) scale(40);opacity:0}
  }

  /* === Section 6: PEOPLE SPACE forming — inherits the burst remnant === */
  #s6 .formation{position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%)}
  #s6 .core-sphere{
    position:absolute;left:50%;top:50%;width:140px;height:140px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 35%, #fff 0%, #fde68a 22%, var(--pink) 50%, var(--violet-bright) 90%);
    box-shadow:0 0 60px var(--magenta), 0 0 140px var(--violet-bright), inset -10px -20px 40px rgba(0,0,0,.4);
    animation:coreBreath 4s ease-in-out infinite alternate;
  }
  @keyframes coreBreath{from{box-shadow:0 0 50px var(--magenta),0 0 120px var(--violet-bright)}to{box-shadow:0 0 80px var(--gold),0 0 180px var(--magenta)}}
  /* rings draw in from the centre — feels like orbits being born from the sphere */
  #s6 .ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(244,114,182,.4);transform:translate(-50%,-50%) scale(.1) rotate(0);opacity:0}
  .scene.active#s6 .ring.a{animation:ringForm 1.4s cubic-bezier(.2,.7,.2,1) .8s forwards, spin 16s linear infinite 1.8s}
  .scene.active#s6 .ring.b{animation:ringForm 1.4s cubic-bezier(.2,.7,.2,1) 1.4s forwards, spin 24s linear infinite reverse 2.4s}
  .scene.active#s6 .ring.c{animation:ringForm 1.4s cubic-bezier(.2,.7,.2,1) 2.0s forwards, spin 32s linear infinite 3.0s}
  #s6 .ring.a{width:300px;height:300px}
  #s6 .ring.b{width:420px;height:420px;border-color:rgba(123,47,247,.4)}
  #s6 .ring.c{width:540px;height:540px;border-color:rgba(251,191,36,.25)}
  @keyframes ringForm{
    0%  {transform:translate(-50%,-50%) scale(.1);opacity:0}
    60% {transform:translate(-50%,-50%) scale(1.06);opacity:.9}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}
  }
  /* In Section 6 we do NOT animate scale on the sphere — it appears to be the same body that lingered from Section 5 */

  /* === Section 7: 4 CLUSTERS — beams + sequenced colors === */
  #s7 .center-orb{
    position:absolute;left:50%;top:50%;width:110px;height:110px;border-radius:50%;
    transform:translate(-50%,-50%) scale(.5);opacity:0;
    background:radial-gradient(circle at 35% 35%,#fff 0%, #fde68a 25%, var(--pink) 55%, var(--violet-bright) 90%);
    box-shadow:0 0 60px var(--magenta), 0 0 140px var(--violet-bright), 0 0 260px rgba(251,191,36,.4);
    transition:opacity 1s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .scene.active#s7 .center-orb{opacity:1;transform:translate(-50%,-50%) scale(1);animation:coreBreath 4s ease-in-out infinite alternate 1.5s}
  #s7 .beams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #s7 .beam{
    stroke:#ffffff;stroke-width:2;stroke-linecap:round;
    stroke-dasharray:1200;stroke-dashoffset:1200;
    filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 22px rgba(251,191,36,.6));
    opacity:0;
  }
  .scene.active#s7 .b-tl{animation:beamDraw 1.2s cubic-bezier(.2,.85,.2,1) .6s forwards;stroke:#fbbf24}
  .scene.active#s7 .b-tr{animation:beamDraw 1.2s cubic-bezier(.2,.85,.2,1) 1.6s forwards;stroke:#d946ef}
  .scene.active#s7 .b-bl{animation:beamDraw 1.2s cubic-bezier(.2,.85,.2,1) 2.6s forwards;stroke:#67e8f9}
  .scene.active#s7 .b-br{animation:beamDraw 1.2s cubic-bezier(.2,.85,.2,1) 3.6s forwards;stroke:#a78bfa}
  @keyframes beamDraw{
    0%{stroke-dashoffset:1200;opacity:0}
    20%{opacity:1}
    100%{stroke-dashoffset:0;opacity:.85}
  }
  #s7 .cluster{
    position:absolute;width:200px;height:200px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;transform:scale(.5);
    transition:opacity .8s ease, transform .9s cubic-bezier(.2,.8,.2,1);
  }
  #s7 .cluster .orb{
    width:70px;height:70px;border-radius:50%;margin-bottom:18px;
    transition:box-shadow .6s ease, transform .8s ease;
  }
  #s7 .cluster[data-color="gold"]    .orb{background:radial-gradient(circle,#fff, #fde68a 30%, #fbbf24 80%);box-shadow:0 0 28px #fbbf24, 0 0 70px rgba(251,191,36,.6)}
  #s7 .cluster[data-color="magenta"] .orb{background:radial-gradient(circle,#fff, #f9a8d4 30%, #d946ef 80%);box-shadow:0 0 28px #d946ef, 0 0 70px rgba(217,70,239,.6)}
  #s7 .cluster[data-color="blue"]    .orb{background:radial-gradient(circle,#fff, #bfdbfe 30%, #67e8f9 80%);box-shadow:0 0 28px #67e8f9, 0 0 70px rgba(103,232,249,.55)}
  #s7 .cluster[data-color="violet"]  .orb{background:radial-gradient(circle,#fff, #ddd6fe 30%, #a78bfa 80%);box-shadow:0 0 28px #a78bfa, 0 0 70px rgba(167,139,250,.6)}

  #s7 .cluster .label{
    font-family:'Cormorant Garamond', serif;font-style:italic;font-weight:400;
    letter-spacing:.06em;font-size:clamp(22px,2vw,32px);
    color:var(--text);text-transform:none;min-height:1.1em;
    text-shadow:0 0 22px rgba(255,255,255,.6), 0 0 50px rgba(255,200,120,.5);
  }
  #s7 .cluster .label::after{
    content:"|";display:inline-block;margin-left:2px;opacity:0;
    color:var(--gold);
    animation:caretBlink 1s steps(2,end) infinite;
  }
  #s7 .cluster.typing .label::after{opacity:1}
  #s7 .cluster.typed .label::after{display:none}
  @keyframes caretBlink{50%{opacity:0}}

  /* corner positions — tighter so labels don't fight POSSIBILITIES keyword */
  #s7 .cluster.tl{top:8%;left:6%}
  #s7 .cluster.tr{top:8%;right:6%}
  #s7 .cluster.bl{bottom:8%;left:6%}
  #s7 .cluster.br{bottom:8%;right:6%}

  /* clusters appear in sequence aligned with the beam timing */
  .scene.active#s7 .cluster.tl{opacity:1;transform:scale(1);transition-delay:1.4s}
  .scene.active#s7 .cluster.tr{opacity:1;transform:scale(1);transition-delay:2.4s}
  .scene.active#s7 .cluster.bl{opacity:1;transform:scale(1);transition-delay:3.4s}
  .scene.active#s7 .cluster.br{opacity:1;transform:scale(1);transition-delay:4.4s}

  /* When section 7 keyword is shown, place it slightly above center so it doesn't cover the orb */
  #s7 .keyword{top:38%}

  /* === Section 8: hero pull-back — feels like the People Space sphere zoomed back === */
  #s8 .hero-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;animation:none}
  .scene.active#s8 .hero-wrap{animation:heroPullBack 2.4s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes heroPullBack{
    0%{opacity:0;transform:translate(-50%,-50%) scale(2.4);filter:blur(12px)}
    50%{opacity:.9;transform:translate(-50%,-50%) scale(1.05);filter:blur(0)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}
  }
  #s8 .logo-orbit{
    position:relative;width:300px;height:300px;margin:0 auto 24px;
    display:flex;align-items:center;justify-content:center;
  }
  #s8 .logo-orbit::before, #s8 .logo-orbit::after{
    content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(244,114,182,.3);
  }
  #s8 .logo-orbit::after{inset:-30px;border-color:rgba(123,47,247,.3);animation:spin 30s linear infinite}
  #s8 .logo-orbit::before{animation:spin 20s linear infinite reverse}
  #s8 .logo-glow{
    position:absolute;inset:30px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.15) 0%, rgba(217,70,239,.4) 30%, rgba(123,47,247,.4) 60%, transparent 80%);
    filter:blur(20px);
  }
  #s8 .brand{
    position:relative;font-family:'Cormorant Garamond', serif;font-weight:300;
    font-size:clamp(40px,5.2vw,84px);letter-spacing:.18em;line-height:1;
    color:#fff;text-transform:uppercase;
    text-shadow:0 0 30px rgba(217,70,239,.7), 0 0 90px rgba(123,47,247,.5);
  }
  #s8 .brand em{
    font-family:'Italiana', serif;font-style:normal;font-weight:400;
    background:linear-gradient(180deg,#fff 0%,#fbbf24 70%,#fb923c 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    letter-spacing:.12em;
  }
  #s8 .brand-divider{
    display:block;width:80px;height:1px;margin:18px auto 18px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  #s8 .tag{
    font-family:'Tenor Sans', sans-serif;font-weight:400;
    letter-spacing:.6em;font-size:clamp(11px,1.05vw,14px);text-transform:uppercase;color:var(--muted);
    text-shadow:0 0 20px rgba(217,70,239,.4);
  }
  #s8 .cta{
    margin-top:44px;display:inline-flex;align-items:center;gap:18px;
    font-family:'Cormorant Garamond', serif;font-style:italic;font-weight:400;
    letter-spacing:.16em;font-size:clamp(18px,1.6vw,24px);text-transform:none;color:var(--gold);
  }
  #s8 .cta::after{content:"";width:60px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
  #s8 .logo-img{position:relative;max-width:240px;max-height:240px;filter:drop-shadow(0 0 30px rgba(217,70,239,.6)) drop-shadow(0 0 60px rgba(123,47,247,.4));display:none}
  #s8.has-logo .ps-logo{display:none}
  #s8.has-logo .logo-img{display:block}

  /* Inline SVG logo (Saturn-with-star) — shown in the hero ring */
  .ps-logo{
    position:relative;width:200px;height:200px;
    filter:drop-shadow(0 0 22px rgba(255,255,255,.45))
           drop-shadow(0 0 60px rgba(217,70,239,.6))
           drop-shadow(0 0 120px rgba(123,47,247,.45));
  }
  .ps-logo svg{width:100%;height:100%;display:block}
  .ps-logo .lg-stroke{stroke:#fff;fill:none;stroke-width:6;stroke-linecap:round}
  .ps-logo .lg-fill{fill:url(#psFill)}
  .ps-logo .lg-star{fill:#fff}
  .scene.active .ps-logo{animation:logoFloat 7s ease-in-out infinite alternate}
  @keyframes logoFloat{from{transform:translateY(-3px) rotate(-2deg)}to{transform:translateY(3px) rotate(2deg)}}

  /* re-style brand text to sit BELOW the logo */
  #s8 .hero-wrap{display:flex;flex-direction:column;align-items:center}
  #s8 .logo-orbit{margin-bottom:30px}

  /* === HUD overlays === */
  .hud{position:fixed;z-index:100;font-family:'Tenor Sans', sans-serif;color:var(--text)}
  .section-indicator{
    top:28px;left:32px;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--muted);
  }
  .section-indicator span{color:var(--gold);font-weight:500;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;letter-spacing:.05em;margin:0 4px}

  .scroll-hint{
    bottom:28px;left:50%;transform:translateX(-50%);
    text-align:center;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--muted);
    transition:opacity .6s;font-family:'Tenor Sans',sans-serif;
  }
  .scroll-hint.hidden{opacity:0;pointer-events:none}
  .scroll-hint .arrow{
    display:block;margin:8px auto 0;width:1px;height:30px;
    background:linear-gradient(180deg,var(--gold),transparent);
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(8px);opacity:.4}}

  .progress-rail{
    top:50%;right:24px;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:10px;
  }
  .progress-rail .dot{
    width:8px;height:8px;border-radius:50%;border:1px solid rgba(244,114,182,.5);
    cursor:pointer;background:transparent;transition:all .3s;
  }
  .progress-rail .dot.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px var(--gold)}

  .audio-toggle{
    bottom:28px;right:32px;display:flex;align-items:center;gap:10px;
    padding:9px 16px;border:1px solid rgba(244,114,182,.3);border-radius:100px;
    background:rgba(10,5,36,.7);backdrop-filter:blur(14px);
    cursor:pointer;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);
    transition:all .25s;font-family:'Tenor Sans', sans-serif;
  }
  .audio-toggle:hover{color:var(--text);border-color:var(--magenta)}
  .audio-toggle svg{width:14px;height:14px}
  .audio-toggle.on{color:var(--gold);border-color:var(--gold);box-shadow:0 0 18px rgba(251,191,36,.3)}

  /* enable-sound overlay shown on first load (autoplay needs user gesture) */
  #enableSound{
    position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(10,5,36,.85), rgba(0,0,0,.95));
    backdrop-filter:blur(8px);cursor:pointer;
    transition:opacity .8s ease;
  }
  #enableSound.hidden{opacity:0;pointer-events:none}
  #enableSound .panel{
    text-align:center;padding:40px 60px;border:1px solid rgba(244,114,182,.3);border-radius:8px;
    background:rgba(10,5,36,.6);
    box-shadow:0 0 60px rgba(123,47,247,.25), 0 0 120px rgba(217,70,239,.15);
  }
  #enableSound .gate-logo{width:100px;height:100px;margin:0 auto 22px;
    filter:drop-shadow(0 0 22px rgba(255,255,255,.4))
           drop-shadow(0 0 50px rgba(217,70,239,.55))
           drop-shadow(0 0 90px rgba(123,47,247,.4));
    animation:logoFloat 7s ease-in-out infinite alternate;
  }
  #enableSound .gate-logo svg{width:100%;height:100%;display:block}
  #enableSound h1{
    font-family:'Cormorant Garamond', serif;font-weight:300;font-size:clamp(36px,5vw,72px);
    letter-spacing:.16em;text-transform:uppercase;color:#fff;line-height:1;
    text-shadow:0 0 30px rgba(217,70,239,.5);
    margin-bottom:14px;
  }
  #enableSound h1 em{
    font-family:'Italiana', serif;font-style:normal;font-weight:400;
    background:linear-gradient(180deg,#fff 0%,#fbbf24 70%,#fb923c 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    letter-spacing:.1em;
  }
  #enableSound .div{display:block;width:80px;height:1px;margin:14px auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  #enableSound p{font-family:'Tenor Sans',sans-serif;color:var(--muted);font-size:12px;letter-spacing:.4em;text-transform:uppercase;margin-bottom:30px}
  #enableSound .start-btn{
    display:inline-flex;align-items:center;gap:16px;padding:16px 36px;
    background:linear-gradient(90deg,rgba(251,191,36,.12),rgba(217,70,239,.12));
    border:1px solid var(--gold);border-radius:100px;
    color:var(--gold);font-family:'Cormorant Garamond', serif;font-style:italic;font-size:18px;
    letter-spacing:.12em;cursor:pointer;
    transition:all .3s;
  }
  #enableSound .start-btn:hover{
    background:linear-gradient(90deg,rgba(251,191,36,.25),rgba(217,70,239,.25));
    box-shadow:0 0 30px rgba(251,191,36,.4);
    transform:scale(1.02);
  }
</style>
</head>
<body>

<!-- Fixed cosmic backdrop, shared across all scenes -->
<div class="bg-fixed">
  <div class="deep-space"></div>
  <div class="nebula">
    <div class="milky-band"></div>
    <div class="dust-cloud c3"></div>
    <div class="dust-cloud c1"></div>
    <div class="dust-cloud c2"></div>
    <div class="dust-streak s1"></div>
    <div class="dust-streak s2"></div>
  </div>
  <canvas class="stars-canvas" id="stars"></canvas>
  <canvas class="stars-canvas" id="shooting" style="z-index:2"></canvas>
  <div class="dust" id="dust"></div>
</div>
<div class="vignette"></div>
<div class="grain"></div>

<!-- Vertical scroll-snap container -->
<main id="scroller">

  <!-- ===== Section 1: VAST ===== -->
  <section class="scene" id="s1" data-vo="1">
    <div class="scene-inner">
      <div id="s1-core" class="vast-core"></div>
    </div>
    <div class="keyword center reveal delay-3">VAST</div>
  </section>

  <!-- ===== Section 2: CHAOS ===== -->
  <section class="scene" id="s2" data-vo="2">
    <div class="scene-inner">
      <div class="chaos" id="chaos-container"></div>
    </div>
    <div class="keyword center reveal delay-2">CHAOS</div>
  </section>

  <!-- ===== Section 3: STRUCTURE / ORBIT ===== -->
  <section class="scene" id="s3" data-vo="3">
    <div class="scene-inner">
      <div class="orbit-system">
        <div class="core-star"></div>
        <div class="orbit-ring r1"></div>
        <div class="orbit-ring r2"></div>
        <div class="orbit-ring r3"></div>
        <div class="orbit-ring r4"></div>
        <div class="orbit-body b1"><div class="planet" style="left:15%;top:0;background:radial-gradient(circle,#fff,var(--gold));box-shadow:0 0 18px var(--gold)"></div></div>
        <div class="orbit-body b2"><div class="planet" style="left:27.5%;top:0;background:radial-gradient(circle,#fff,var(--pink));box-shadow:0 0 18px var(--magenta)"></div></div>
        <div class="orbit-body b3"><div class="planet" style="left:40%;top:0;background:radial-gradient(circle,#fff,var(--violet-bright));box-shadow:0 0 18px var(--violet-bright)"></div></div>
        <div class="orbit-body b4"><div class="planet" style="left:52.5%;top:0;background:radial-gradient(circle,#fff,var(--cyan));box-shadow:0 0 18px var(--cyan)"></div></div>
      </div>
    </div>
    <div class="keyword center reveal delay-2">ORBIT</div>
  </section>

  <!-- ===== Section 4: ECOSYSTEM ===== -->
  <section class="scene" id="s4" data-vo="4">
    <div class="scene-inner">
      <svg id="netSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="netGrad" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#fbbf24" stop-opacity=".7"/>
            <stop offset="50%" stop-color="#d946ef" stop-opacity=".5"/>
            <stop offset="100%" stop-color="#7b2ff7" stop-opacity=".4"/>
          </linearGradient>
        </defs>
        <g id="netLines"></g>
      </svg>
      <div id="nodes"></div>
    </div>
    <div class="keyword center reveal delay-2">ECOSYSTEM</div>
  </section>

  <!-- ===== Section 5: BURST ===== -->
  <section class="scene" id="s5" data-vo="5">
    <div class="scene-inner">
      <div class="burst-core"></div>
      <div class="shockwave s1"></div>
      <div class="shockwave s2"></div>
      <div class="shockwave s3"></div>
      <div class="burst-remnant"></div>
    </div>
    <div class="keyword center reveal delay-3">BURST</div>
  </section>

  <!-- ===== Section 6: PEOPLE SPACE forming ===== -->
  <section class="scene" id="s6" data-vo="6">
    <div class="scene-inner">
      <div class="formation">
        <div class="core-sphere"></div>
        <div class="ring a"></div>
        <div class="ring b"></div>
        <div class="ring c"></div>
      </div>
    </div>
    <div class="keyword center reveal delay-2">PEOPLE SPACE</div>
  </section>

  <!-- ===== Section 7: 4 CLUSTERS — beams, sequenced reveal ===== -->
  <section class="scene" id="s7" data-vo="7">
    <div class="scene-inner">
      <svg class="beams" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="beamGoldH" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fff" stop-opacity=".0"/>
            <stop offset="20%" stop-color="#fff" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#fbbf24" stop-opacity=".0"/>
          </linearGradient>
          <linearGradient id="beamGoldHR" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0%" stop-color="#fff" stop-opacity=".0"/>
            <stop offset="20%" stop-color="#fff" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#d946ef" stop-opacity=".0"/>
          </linearGradient>
        </defs>
        <line class="beam b-tl" x1="800" y1="450" x2="280" y2="200"/>
        <line class="beam b-tr" x1="800" y1="450" x2="1320" y2="200"/>
        <line class="beam b-bl" x1="800" y1="450" x2="280" y2="700"/>
        <line class="beam b-br" x1="800" y1="450" x2="1320" y2="700"/>
      </svg>
      <div class="center-orb"></div>
      <div class="cluster tl" data-color="gold"><div class="orb"></div><div class="label" data-text="Organization"></div></div>
      <div class="cluster tr" data-color="magenta"><div class="orb"></div><div class="label" data-text="HR"></div></div>
      <div class="cluster bl" data-color="blue"><div class="orb"></div><div class="label" data-text="Employees"></div></div>
      <div class="cluster br" data-color="violet"><div class="orb"></div><div class="label" data-text="Managers"></div></div>
    </div>
    <div class="keyword center reveal delay-2">POSSIBILITIES</div>
  </section>

  <!-- ===== Section 8: Hero / Final ===== -->
  <section class="scene" id="s8" data-vo="8">
    <div class="scene-inner">
      <div class="hero-wrap">
        <div class="logo-orbit reveal delay-1">
          <div class="logo-glow"></div>
          <img class="logo-img" id="logoImg" alt="People Space logo"/>
          <div class="ps-logo" id="psLogoSvg">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="People Space">
              <defs>
                <radialGradient id="psFill" cx="40%" cy="40%" r="65%">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="35%" stop-color="#fbbf24"/>
                  <stop offset="70%" stop-color="#d946ef"/>
                  <stop offset="100%" stop-color="#4a1f9c"/>
                </radialGradient>
              </defs>
              <!-- planet body -->
              <circle class="lg-fill" cx="100" cy="100" r="44"/>
              <!-- planet outline -->
              <circle class="lg-stroke" cx="100" cy="100" r="44"/>
              <!-- ring (tilted ellipse) -->
              <g transform="rotate(-22 100 100)">
                <ellipse class="lg-stroke" cx="100" cy="100" rx="78" ry="22"/>
              </g>
              <!-- small star -->
              <circle class="lg-star" cx="160" cy="44" r="5"/>
            </svg>
          </div>
        </div>
        <div class="brand reveal delay-2">People <em>Space</em></div>
        <span class="brand-divider reveal delay-2"></span>
        <div class="tag reveal delay-2">An orbit of possibilities</div>
        <div class="cta reveal delay-3">Let's begin →</div>
      </div>
    </div>
  </section>

</main>

<!-- 8 voice-over audio slots -->
<audio id="vo1" preload="auto" src="1.mp3"></audio>
<audio id="vo2" preload="auto" src="2.mp3"></audio>
<audio id="vo3" preload="auto" src="3.mp3"></audio>
<audio id="vo4" preload="auto" src="4.mp3"></audio>
<audio id="vo5" preload="auto" src="5.mp3"></audio>
<audio id="vo6" preload="auto" src="6.mp3"></audio>
<audio id="vo7" preload="auto" src="7.mp3"></audio>
<audio id="vo8" preload="auto" src="8.mp3"></audio>
<!-- Ambient cosmic pad -->
<audio id="ambient" preload="auto" loop src="ambient.mp3"></audio>

<!-- HUD overlays -->
<div class="hud section-indicator">Chapter <span id="sectionNum">I</span> &nbsp;·&nbsp; of VIII</div>

<div class="hud progress-rail" id="progressRail"></div>

<div class="hud scroll-hint" id="scrollHint">
  Scroll to explore
  <span class="arrow"></span>
</div>

<button class="hud audio-toggle" id="autoToggle" style="bottom:28px;right:32px">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
  <span id="autoLabel">Auto-play</span>
</button>

<!-- start gate -->
<div id="enableSound">
  <div class="panel">
    <div class="gate-logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="People Space">
        <defs>
          <radialGradient id="psFillGate" cx="40%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#fbbf24"/>
            <stop offset="70%" stop-color="#d946ef"/>
            <stop offset="100%" stop-color="#4a1f9c"/>
          </radialGradient>
        </defs>
        <circle fill="url(#psFillGate)" cx="100" cy="100" r="44"/>
        <circle stroke="#fff" fill="none" stroke-width="6" stroke-linecap="round" cx="100" cy="100" r="44"/>
        <g transform="rotate(-22 100 100)">
          <ellipse stroke="#fff" fill="none" stroke-width="6" stroke-linecap="round" cx="100" cy="100" rx="78" ry="22"/>
        </g>
        <circle fill="#fff" cx="160" cy="44" r="5"/>
      </svg>
    </div>
    <h1>People <em>Space</em></h1>
    <span class="div"></span>
    <p>Headphones recommended &nbsp;·&nbsp; scroll to advance</p>
    <button class="start-btn">Begin the journey →</button>
  </div>
</div>

<script>
/* === Split keyword text into per-letter spans for staggered reveal === */
(function splitKeywords(){
  document.querySelectorAll('.keyword').forEach(el=>{
    const text = el.textContent;
    const wrap = document.createElement('span');
    wrap.className = 'ksplit-wrap';
    const inner = document.createElement('span');
    inner.className = 'ksplit';
    let i = 0;
    for(const ch of text){
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.transitionDelay = (0.08 + i*0.05) + 's';
      inner.appendChild(s);
      i++;
    }
    wrap.appendChild(inner);
    el.textContent = '';
    el.appendChild(wrap);
    // inject a dark halo behind for legibility
    const scene = el.closest('.scene');
    if(scene && !scene.querySelector('.kw-halo')){
      const halo = document.createElement('div');
      halo.className = 'kw-halo center';
      scene.appendChild(halo);
    }
  });

  // Auto-fit every keyword. Iteratively reduces font-size until both width & height fit.
  function fitKeywords(){
    const targetW = innerWidth * 0.78;
    const targetH = innerHeight * 0.42;
    document.querySelectorAll('.keyword').forEach(el=>{
      // start from a reset font-size based on viewport
      let f = Math.min(170, innerWidth * 0.075);
      el.style.fontSize = f + 'px';
      // measure the inline-block wrap (true content width)
      const inner = el.querySelector('.ksplit-wrap') || el;
      let safety = 24;
      while(safety-- > 0){
        const r = inner.getBoundingClientRect();
        if(r.width <= targetW && r.height <= targetH) break;
        // shrink by the worst overflow ratio
        const ratio = Math.min(targetW / r.width, targetH / r.height);
        f = Math.max(28, f * ratio * 0.98);
        el.style.fontSize = f + 'px';
        if(ratio > 0.985) break; // close enough
      }
    });
  }
  // Run multiple times to catch font-load + layout settle
  function scheduleFit(){
    fitKeywords();
    requestAnimationFrame(fitKeywords);
    setTimeout(fitKeywords, 100);
    setTimeout(fitKeywords, 400);
    setTimeout(fitKeywords, 1200);
  }
  scheduleFit();
  addEventListener('resize', fitKeywords);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);
})();

/* === Dense Milky Way star field with warm tinting near the band === */
(function initStars(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  // Milky Way band parameters (rotated -22deg). Distance from this line determines density and tint.
  const ANG = -22 * Math.PI/180;
  function bandDist(x,y){
    // band line passes through center, slope = tan(ANG)
    const cx = innerWidth/2, cy = innerHeight/2;
    const dx = x-cx, dy = y-cy;
    // perpendicular distance to the rotated line
    return Math.abs(-Math.sin(ANG)*dx + Math.cos(ANG)*dy);
  }
  // distance along the band (measures how far from band's brightest core, which is at ~+25% along)
  function alongBand(x,y){
    const cx = innerWidth/2, cy = innerHeight/2;
    const dx = x-cx, dy = y-cy;
    return Math.cos(ANG)*dx + Math.sin(ANG)*dy;
  }

  function resize(){
    c.width = innerWidth * devicePixelRatio;
    c.height = innerHeight * devicePixelRatio;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(devicePixelRatio, devicePixelRatio);
    seed();
  }
  function seed(){
    stars = [];
    // Much denser star field
    const baseN = Math.floor((innerWidth*innerHeight)/1100);
    const bandN = Math.floor((innerWidth*innerHeight)/450);
    // background scattered stars
    for(let i=0;i<baseN;i++){
      stars.push({
        x:Math.random()*innerWidth,
        y:Math.random()*innerHeight,
        z:Math.random()*0.7+0.2,
        s:Math.random()*1.1+0.15,
        tw:Math.random()*Math.PI*2,
        tint:Math.random()<0.08?'warm':(Math.random()<0.05?'cool':'white')
      });
    }
    // dense band stars — sample positions concentrated near the galactic line
    const cx = innerWidth/2, cy = innerHeight/2;
    const bandHalfHeight = Math.min(innerWidth, innerHeight) * 0.32;
    const bandLength = Math.hypot(innerWidth, innerHeight) * 0.75;
    for(let i=0;i<bandN;i++){
      // gaussian-ish offset from line
      let off = 0;
      for(let k=0;k<4;k++) off += (Math.random()-0.5);
      off = off/4 * bandHalfHeight*1.4;
      const along = (Math.random()-0.5)*bandLength;
      const x = cx + Math.cos(ANG)*along - Math.sin(ANG)*off;
      const y = cy + Math.sin(ANG)*along + Math.cos(ANG)*off;
      if(x<-50||x>innerWidth+50||y<-50||y>innerHeight+50) continue;
      // density falls off from band core
      const distFromCore = Math.abs(off)/bandHalfHeight;
      const sizeMul = 1 - distFromCore*0.6;
      stars.push({
        x, y,
        z:Math.random()*0.8+0.3,
        s:(Math.random()*1.1+0.18)*sizeMul,
        tw:Math.random()*Math.PI*2,
        // warmer tint near band core
        tint: distFromCore<0.5 ? (Math.random()<0.55?'warm':'white') : 'white'
      });
    }
  }
  function colorFor(tint, a){
    if(tint==='warm') return `rgba(255,${Math.floor(210+30*Math.random())},${Math.floor(150+50*Math.random())},${a})`;
    if(tint==='cool') return `rgba(180,200,255,${a})`;
    return `rgba(255,255,255,${a})`;
  }
  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const st of stars){
      st.tw += 0.012 + st.z*0.008;
      const a = 0.35 + 0.65*Math.abs(Math.sin(st.tw));
      ctx.beginPath();
      ctx.fillStyle = colorFor(st.tint, a*st.z);
      ctx.arc(st.x, st.y, st.s*st.z, 0, Math.PI*2);
      ctx.fill();
      // very slow drift
      st.x += 0.012*st.z;
      if(st.x>innerWidth+5) st.x = -5;
    }
    requestAnimationFrame(tick);
  }
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);
})();

/* === Occasional shooting stars === */
(function initShooting(){
  const c = document.getElementById('shooting');
  const ctx = c.getContext('2d');
  function resize(){
    c.width = innerWidth * devicePixelRatio;
    c.height = innerHeight * devicePixelRatio;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(devicePixelRatio, devicePixelRatio);
  }
  addEventListener('resize', resize); resize();

  let active = null;
  function spawn(){
    const angle = (-22 + (Math.random()-.5)*30) * Math.PI/180;
    const startX = Math.random()*innerWidth*0.6;
    const startY = Math.random()*innerHeight*0.5;
    const len = innerWidth*0.18 + Math.random()*innerWidth*0.12;
    active = {x:startX, y:startY, dx:Math.cos(angle), dy:Math.sin(angle), len, t:0, life:1.4};
  }
  setInterval(()=>{ if(!active && Math.random()<0.6) spawn(); }, 5000);

  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    if(active){
      active.t += 1/60;
      const p = active.t/active.life;
      const easeOut = 1 - Math.pow(1-p, 3);
      const speed = innerWidth*0.55;
      active.x += active.dx*speed*(1/60);
      active.y += active.dy*speed*(1/60);
      // tail
      const tailX = active.x - active.dx*active.len;
      const tailY = active.y - active.dy*active.len;
      const grad = ctx.createLinearGradient(tailX, tailY, active.x, active.y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(.7, 'rgba(255,240,210,'+(0.7*(1-p))+')');
      grad.addColorStop(1, 'rgba(255,255,255,'+(1-p)+')');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(active.x, active.y);
      ctx.stroke();
      // bright head
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,'+(1-p)+')';
      ctx.arc(active.x, active.y, 1.6, 0, Math.PI*2);
      ctx.fill();
      if(p>=1) active = null;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* === Dust === */
(function initDust(){
  const dust = document.getElementById('dust');
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*-18) + 's';
    s.style.animationDuration = (12 + Math.random()*14) + 's';
    s.style.opacity = (0.3 + Math.random()*0.5).toFixed(2);
    dust.appendChild(s);
  }
})();

/* === CHAOS bodies (Section 2) === */
(function initChaos(){
  const c = document.getElementById('chaos-container');
  const colors = ['#fbbf24','#f472b6','#d946ef','#7b2ff7','#67e8f9','#fb923c','#fff'];
  const N = 28;
  const bodies = [];
  for(let i=0;i<N;i++){
    const b = document.createElement('div');
    b.className = 'body';
    const col = colors[i%colors.length];
    b.style.background = col;
    b.style.boxShadow = `0 0 12px ${col},0 0 28px ${col}`;
    c.appendChild(b);
    bodies.push({el:b, x:Math.random(), y:Math.random(), vx:(Math.random()-.5)*0.0028, vy:(Math.random()-.5)*0.0028});
  }
  // assign aligned grid targets
  const cols = 7, rows = 4;
  bodies.forEach((b,i)=>{
    const r = Math.floor(i/cols), col = i%cols;
    b.tx = 0.15 + (col/(cols-1))*0.7;
    b.ty = 0.25 + (r/(rows-1))*0.5;
  });
  let aligned = 0;
  let alignTarget = 0;
  let alignTimer = null;
  function startAlign(){
    aligned = 0; alignTarget = 0;
    clearTimeout(alignTimer);
    alignTimer = setTimeout(()=>{ alignTarget = 1; }, 5500); // align halfway through section
  }
  window._chaosStart = startAlign;
  function tick(){
    aligned += (alignTarget - aligned) * 0.012;
    for(const b of bodies){
      b.x += b.vx; b.y += b.vy;
      if(b.x<0||b.x>1) b.vx*=-1;
      if(b.y<0||b.y>1) b.vy*=-1;
      const x = b.x + (b.tx - b.x)*aligned;
      const y = b.y + (b.ty - b.y)*aligned;
      b.el.style.left = (x*100)+'%';
      b.el.style.top  = (y*100)+'%';
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* === Ecosystem nodes (Section 4) === */
(function initEcosystem(){
  const root = document.getElementById('nodes');
  const svgG = document.getElementById('netLines');
  const N = 14;
  const positions = [];
  for(let i=0;i<N;i++){
    const x = 0.12 + Math.random()*0.76;
    const y = 0.18 + Math.random()*0.55;
    positions.push({x,y});
    const n = document.createElement('div');
    n.className = 'node';
    n.style.left = (x*100)+'%';
    n.style.top = (y*100)+'%';
    n.style.animationDelay = (Math.random()*2)+'s';
    root.appendChild(n);
  }
  for(let i=0;i<N;i++){
    const dists = positions.map((p,j)=>({j, d:Math.hypot(p.x-positions[i].x, p.y-positions[i].y)}))
      .filter(o=>o.j!==i).sort((a,b)=>a.d-b.d).slice(0,3);
    for(const {j} of dists){
      const a = positions[i], b = positions[j];
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', a.x*1600);
      line.setAttribute('y1', a.y*900);
      line.setAttribute('x2', b.x*1600);
      line.setAttribute('y2', b.y*900);
      line.setAttribute('class','net-line');
      svgG.appendChild(line);
    }
  }
})();

/* === Try to auto-load logo image === */
(function tryLogo(){
  const img = document.getElementById('logoImg');
  const tryNames = ['logo.png','logo.svg','logo.jpg','logo.jpeg','logo.webp','people-space.png','people-space.svg'];
  let i=0;
  function next(){
    if(i>=tryNames.length) return;
    const test = new Image();
    test.onload = ()=>{
      img.src = test.src;
      document.getElementById('s8').classList.add('has-logo');
    };
    test.onerror = ()=>{ i++; next(); };
    test.src = tryNames[i];
  }
  next();
})();

/* === Scene activation + voice-over orchestration === */
const scenes = Array.from(document.querySelectorAll('.scene'));
const audios = scenes.map((s,i)=>document.getElementById('vo'+(i+1)));
const ambient = document.getElementById('ambient');
const sectionNum = document.getElementById('sectionNum');
const scrollHint = document.getElementById('scrollHint');
const progressRail = document.getElementById('progressRail');
const autoToggle = document.getElementById('autoToggle');
const autoLabel = document.getElementById('autoLabel');
const enableGate = document.getElementById('enableSound');

let currentIdx = -1;
let audioOn = true;
let autoPlay = false;
let started = false;
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII'];

/* fade ambient music in/out smoothly */
ambient.volume = 0;
function fadeAmbientTo(target, ms){
  const start = ambient.volume;
  const t0 = performance.now();
  function step(){
    const k = Math.min(1, (performance.now()-t0)/ms);
    ambient.volume = start + (target-start)*k;
    if(k<1) requestAnimationFrame(step);
  }
  step();
}

/* duck ambient while voice plays so the voice stays clear */
function setVoiceDuckingFor(idx){
  audios.forEach((a,i)=>{
    a.onplay = a.onpause = a.onended = null;
  });
  const a = audios[idx];
  if(!a) return;
  a.addEventListener('play', ()=>fadeAmbientTo(0.12, 350), {once:true});
  a.addEventListener('pause', ()=>fadeAmbientTo(0.32, 600), {once:true});
  a.addEventListener('ended', ()=>{
    fadeAmbientTo(0.32, 600);
    if(autoPlay && started){
      // advance to next chapter automatically
      const next = Math.min(scenes.length-1, idx+1);
      if(next !== idx) scenes[next].scrollIntoView({behavior:'smooth'});
    }
  }, {once:true});
}

/* Section 7 cluster typing — runs each time S7 becomes active */
function runSection7Choreography(){
  const clusters = document.querySelectorAll('#s7 .cluster');
  // schedule typing per cluster aligned with the voice "for organizations, HR, employees, and managers"
  const order = ['tl','tr','bl','br'];   // matches beam order
  const startDelays = [1500, 2500, 3500, 4500]; // ms after section becomes active
  clusters.forEach(c=>{
    const lbl = c.querySelector('.label');
    lbl.textContent = '';
    c.classList.remove('typing','typed');
  });
  order.forEach((pos,i)=>{
    const cluster = document.querySelector('#s7 .cluster.'+pos);
    if(!cluster) return;
    const label = cluster.querySelector('.label');
    const text = label.dataset.text || '';
    setTimeout(()=>{
      cluster.classList.add('typing');
      let j = 0;
      const iv = setInterval(()=>{
        label.textContent = text.slice(0, ++j);
        if(j >= text.length){
          clearInterval(iv);
          cluster.classList.remove('typing');
          cluster.classList.add('typed');
        }
      }, 70);
    }, startDelays[i]);
  });
}

// Build progress rail dots
scenes.forEach((s,i)=>{
  const d = document.createElement('button');
  d.className = 'dot'; d.title = 'Section '+(i+1);
  d.addEventListener('click', ()=>{
    s.scrollIntoView({behavior:'smooth'});
  });
  progressRail.appendChild(d);
});
const dots = Array.from(progressRail.children);

function activate(idx){
  if(idx === currentIdx) return;
  // deactivate previous
  scenes.forEach((s,i)=>{
    s.classList.toggle('active', i===idx);
    if(dots[i]) dots[i].classList.toggle('active', i===idx);
  });
  // retrigger animations for the active scene
  scenes[idx].classList.remove('active');
  void scenes[idx].offsetWidth;
  scenes[idx].classList.add('active');
  // pause others, play this one's voice
  audios.forEach((a,i)=>{
    if(i!==idx){ try{a.pause(); a.currentTime=0;}catch(e){} }
  });
  if(started && audioOn){
    const a = audios[idx];
    if(a){
      setVoiceDuckingFor(idx);
      a.currentTime = 0;
      a.play().catch(()=>{});
    }
  }
  // section-specific kicks
  if(idx===1 && window._chaosStart) window._chaosStart();
  if(idx===6) runSection7Choreography();
  currentIdx = idx;
  sectionNum.textContent = ROMAN[idx];
  // hide scroll hint after first advance
  if(idx>0) scrollHint.classList.add('hidden');
}

// Use IntersectionObserver against the scroller
const io = new IntersectionObserver((entries)=>{
  // pick the entry with the highest intersection ratio
  let best = null;
  for(const e of entries){
    if(!best || e.intersectionRatio > best.intersectionRatio) best = e;
  }
  if(best && best.isIntersecting && best.intersectionRatio > 0.55){
    const idx = scenes.indexOf(best.target);
    if(idx>=0) activate(idx);
  }
},{root:document.getElementById('scroller'), threshold:[0.4,0.55,0.7,0.9]});
scenes.forEach(s=>io.observe(s));

// auto-play toggle
autoToggle.addEventListener('click', ()=>{
  autoPlay = !autoPlay;
  autoLabel.textContent = autoPlay?'Auto-play on':'Auto-play';
  autoToggle.classList.toggle('on', autoPlay);
  // if currently playing a voice, re-arm the ended-handler
  if(autoPlay && currentIdx>=0) setVoiceDuckingFor(currentIdx);
});

// Start gate — needed for autoplay-with-sound permission
function startExperience(){
  if(started) return;
  started = true;
  enableGate.classList.add('hidden');
  // ensure first scene is active and play its audio + ambient
  scenes[0].classList.add('active');
  if(audioOn){
    audios[0].currentTime = 0;
    setVoiceDuckingFor(0);
    audios[0].play().catch(()=>{});
    // start ambient at low volume; fade up
    try{ambient.currentTime = 0; ambient.play().catch(()=>{});}catch(e){}
    fadeAmbientTo(0.32, 2000);
  }
  currentIdx = 0;
  sectionNum.textContent = ROMAN[0];
  if(dots[0]) dots[0].classList.add('active');
}
enableGate.addEventListener('click', startExperience);

// keyboard nav
addEventListener('keydown',(e)=>{
  if(!started){ if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); startExperience(); } return; }
  if(e.code==='ArrowDown' || e.code==='PageDown' || e.code==='Space'){
    e.preventDefault();
    const next = Math.min(scenes.length-1, currentIdx+1);
    scenes[next].scrollIntoView({behavior:'smooth'});
  }
  if(e.code==='ArrowUp' || e.code==='PageUp'){
    e.preventDefault();
    const prev = Math.max(0, currentIdx-1);
    scenes[prev].scrollIntoView({behavior:'smooth'});
  }
});
</script>
